**«Incompleto» y «Pendiente de revisión» son los dos estados abiertos**, y la diferencia entre ellos
es qué le falta: uno tiene campos bloqueantes vacíos y el otro no. Los dos admiten decisión.

**Confirmado y rechazado son terminales.** Un borrador confirmado ya es un producto y uno rechazado
ya se descartó; el reprocesamiento del correo que los originó reemplaza los que sigan abiertos y no
toca a éstos.

**La confirmación no forma una asociación permanente con el producto que crea.** La relación
«el borrador produjo este producto» es una dependencia de proceso —sirve para auditar de dónde salió
un producto— y no una asociación del dominio en tiempo de ejecución.
