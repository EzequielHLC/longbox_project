[[area]]
id = "acceso"
titulo = "Personas y acceso"
conceptos = ["accounts.Usuario", "accounts.IntentoFallido"]
planificados = []
asociaciones_extra = [
  'Usuario "0..1" .. "0..*" IntentoFallido : se cuentan por (correo, IP)',
]
prosa = """
**Un solo concepto de persona, con tres roles.** No hay una entidad `Cliente` separada de una
entidad `Empleado`: es el mismo `Usuario` con distinto `rol`. La decisión se sostiene en que las dos
comparten todo lo que hace a una cuenta —credencial, estado, activación, bloqueo por intentos— y se
diferencian solo en qué pueden hacer, que es exactamente lo que un rol describe.

Los datos de envío del Cliente viven en la misma entidad porque son **uno por cuenta**. Una libreta
de direcciones múltiples, si alguna vez hace falta, pertenece al área de comercio y no acá.

**El consentimiento se guarda fechado y no como un sí o un no.** Un booleano acredita que el titular
aceptó pero no cuándo, y lo que el Artículo 5° de la Ley 25.326 exige poder demostrar es el acto
fechado. De paso, la ausencia de fecha equivale a la ausencia de consentimiento, así que un solo dato
cumple las dos funciones.

**`IntentoFallido` guarda el correo tal como se tipeó**, aunque no corresponda a ninguna cuenta. Si
solo se contaran los intentos contra cuentas existentes, la diferencia de comportamiento delataría
qué correos están registrados.
"""

[[area]]
id = "clasificacion"
titulo = "La clasificación del catálogo"
conceptos = [
  "catalog.Editorial",
  "catalog.GrupoEtiqueta",
  "catalog.Etiqueta",
  "catalog.Tipo",
  "catalog.Formato",
  "catalog.TablaPrecioReferencia",
]
planificados = ["Oferta"]
invitados = ["catalog.Producto", "catalog.ProductoEditorial"]
prosa = """
Ésta es el área donde la regla 2 se ve funcionando. **Dos ejes deciden y uno describe.**

- **`Tipo`** dice qué clase de cosa es: manga, cómic, artbook, novela ligera y libro de un lado; TCG,
  figura, merchandising e insumo del otro. Entra en la clave de unicidad y en la de la tabla de
  precios. Su campo `clase` existe porque cuatro de los cinco consumidores de la tabla son solo
  editoriales, y sin el discriminador nada impide cargar una fila «Ivrea + Figura + B6» en la tabla
  de precios.
- **`Formato`** es el tamaño físico del tomo, y es **lo que fija el precio**: dos tomos de la misma
  editorial y el mismo tipo valen distinto según su tamaño. En qué tipos aplica cada formato lo
  declara el propio formato con una relación de muchos a muchos; declararlo con grupos obligaría a
  duplicar «tapa dura» por cada tipo y partiría la tabla de precios en dos filas para el mismo tamaño
  físico.
- **`Etiqueta`**, agrupada por `GrupoEtiqueta`, solo sirve para encontrar. No entra en ninguna clave,
  no interviene en ningún precio, y un producto puede tener varias. El grupo existe porque sin él el
  filtro de la tienda es una bolsa: un cliente que busca cómics de Marvel y otro que busca manga
  shonen usarían la misma caja revuelta.

**`TablaPrecioReferencia` necesita los tres campos.** La misma editorial cobra distinto un manga que
un cómic, y dentro del manga cobra distinto un B6 que un Tankōbon. Sacar cualquiera de los tres deja
filas que no se pueden distinguir. Los tipos que no se miden por tamaño —artbook, novela ligera— no
entran: su precio se escribe en el alta.

**`Oferta` es el único concepto planificado del área, y su ausencia explica una cosa del modelo
actual:** que `Producto.precio` sea el precio que se cobra. Cuando exista, ese campo va a pasar a ser
el precio base y el precio efectivo va a ser una derivación con la oferta vigente aplicada. La ficha
de `CU-PVP-ALT` declara además que las ofertas no se solapan sobre el mismo alcance, lo que es un
invariante y no una validación de pantalla.
"""

[[area]]
id = "producto"
titulo = "El producto y sus dos especializaciones"
conceptos = [
  "catalog.Producto",
  "catalog.ProductoEditorial",
  "catalog.ProductoNoEditorial",
  "catalog.LoteAlta",
]
planificados = ["SuscripcionReposicion"]
invitados = [
  "catalog.Etiqueta",
  "catalog.Tipo",
  "catalog.Editorial",
  "catalog.Formato",
  "catalog.TablaPrecioReferencia",
  "suppliers.Proveedor",
  "accounts.Usuario",
]
prosa = """
La regla 5 en el diagrama. `Producto` es lo general y no se instancia nunca por su cuenta: un
producto siempre es de un rubro. El sistema lo hace explícito rechazando el guardado de un
`Producto` que no declare especialización, en vez de dejar que la fila huérfana exista y aparezca
más adelante en un listado sin poder abrirse.

**Qué queda en el padre y qué baja.** Queda lo que el inventario único necesita consultar sobre los
dos rubros a la vez —código, título, tipo, estado, stock, precio, etiquetas— y baja lo que solo tiene
sentido en uno. `ProductoEditorial` suma todo lo que hace a una *edición*: volumen, ISBN, editorial,
formato, la maquinaria de precio de los importados y la fecha de llegada.
`ProductoNoEditorial` suma poco y quita bastante, que es justamente el punto.

**«Demorado» no es un estado, es un indicador.** Un producto demorado sigue en pre-venta, se sigue
pudiendo reservar, y lo único que cambió es que se sabe que no llega cuando decía. Modelarlo como
estado obligaría a que salir de la demora implicara elegir a qué estado volver. Solo aplica al
material editorial: el no editorial no admite pre-venta, así que no puede demorarse.

**`LoteAlta` existe por dos motivos que no se resuelven con productos sueltos.** La entrada de
auditoría de una carga es una sola por lote y no una por ítem; y en los importados hay que conservar
el coeficiente de importación y el margen *vigentes al momento del alta*, que después cambian. El
coeficiente se persiste calculado con seis decimales y no se recalcula al leer: los totales del lote
se pueden corregir, pero el coeficiente con el que se fijaron estos precios es un hecho histórico.

**`SuscripcionReposicion` es el único concepto planificado del área** y es el que convierte una
consulta frustrada en un dato: cuántas personas esperan un producto agotado. Es la entrada de
`CU-RST-PRO`, que ordena la propuesta de restock por esa cuenta.
"""

[[area]]
id = "pipeline"
titulo = "De un correo del proveedor a un producto"
conceptos = [
  "suppliers.Proveedor",
  "suppliers.CorreoProveedor",
  "catalog.BorradorProducto",
  "catalog.ConfianzaCampo",
  "catalog.SesionRevision",
]
planificados = ["PropuestaRestock", "LineaPropuestaRestock"]
invitados = ["catalog.ProductoEditorial", "catalog.Editorial", "accounts.Usuario"]
asociaciones_extra = [
  'BorradorProducto ..> ProductoEditorial : al confirmarse crea (dependencia de proceso)',
]
prosa = """
Es el área que más conceptos aportó que ninguna lectura del relevamiento había anticipado, y la
regla 4 es la que los ordena a todos: **el modelo propone, nunca aplica.**

**`Proveedor` es tres cosas a la vez y conviene no confundirlas.** Es una agenda de contactos
comerciales; es el filtro de remitentes válidos del pipeline, lo que convierte a su correo comercial
en una credencial de confianza y no en un dato de contacto cualquiera; y es la cabecera de los
borradores que ese pipeline genere. La editorial y el tipo de material no vienen en el correo, y no
por descuido: la comunicación es directa de la editorial a la comiquería, así que nadie escribe su
propio nombre en su propio newsletter. Que la editorial quede vacía **significa** algo —el proveedor
trae varias— y no es un dato sin cargar.

**`CorreoProveedor` es la cola de aprobación, y es la pieza que hace posible la decisión humana.**
Por la dirección comercial de un proveedor llegan facturas, promociones y avisos de demora, no solo
novedades. Sin la cola, el sistema entrega todos esos mensajes al modelo y produce borradores sin
sentido que alguien tiene que rechazar uno por uno: el trabajo no se elimina, se traslada. Su
identificador de mensaje es la clave de idempotencia, y un ciclo que vuelva a leer la misma casilla
no encola dos veces el mismo correo.

**El estado del correo no es el estado de sus borradores.** Un correo procesado con éxito puede
tener todos sus borradores rechazados y sigue siendo un correo procesado. Son dos ciclos de vida
separados, y confundirlos haría que rechazar borradores revirtiera el estado del correo que los
produjo.

**`ConfianzaCampo` es una entidad y no un dato dentro del borrador** porque la ficha no pide solo
*leer* la confianza: exige que el Administrador haga una acción afirmativa sobre cada campo de
confianza baja antes de poder confirmar. Eso es un dato que se escribe, por campo. Y hay que
distinguirla del **reparo**: la confianza la declara el modelo sobre sí mismo, el reparo es lo que
el sistema le corrigió al contrastarlo con algo verificable —un ISBN cuyo dígito de control no
cierra, una portada referenciada que no está entre las partes del correo.

**`SesionRevision` la ficha no la declara como entidad y la necesita igual.** El flujo habla de «al
cerrar la sesión», audita su cierre con confirmados, rechazados y pendientes, y arma un pedido
consolidado por proveedor *de esa sesión*. Sin algo que agrupe la tanda, dos revisiones el mismo día
producirían un único correo mezclado al mismo proveedor en lugar de dos pedidos separados. Se abre
con la primera decisión y no al abrir la pantalla: mirar la cola no es revisar.

**`PropuestaRestock` y su línea son los conceptos planificados del área.** Reproducen el mismo patrón
de cabecera e ítem que `LoteAlta`, y por el mismo motivo: la propuesta conserva el momento y el tipo
de disparo, y cada línea conserva la cantidad sugerida con la que nació, que el Administrador puede
cambiar antes de despachar.
"""

[[area]]
id = "comercio"
titulo = "Comercio y logística"
conceptos = []
planificados = [
  "Carrito",
  "LineaCarrito",
  "Pedido",
  "LineaPedido",
  "TransaccionPago",
  "CierreDeCaja",
  "CasoDevolucion",
  "ArticuloRetenido",
]
invitados = ["accounts.Usuario", "catalog.Producto"]
prosa = """
**El área entera es planificada.** Ningún concepto de acá existe hoy en el código, y es la mitad del
sistema: los dos canales de venta, el ciclo de vida del pedido, la logística de envíos fraccionados y
las devoluciones.

**`Pedido` es uno solo para los dos canales.** La venta presencial y la compra online producen el
mismo concepto con distinto valor de `canal`; lo que cambia es por qué estados transita —una venta
de mostrador nace despachada, porque el cliente se lleva el material en el momento— y no qué es.
Modelarlos como dos entidades obligaría a duplicar el cierre de caja, el historial del cliente y el
reporte de ventas.

**`LineaPedido` lleva estado propio, y ésa es la decisión que sostiene todo el módulo 08.** Un pedido
con un artículo demorado no está demorado entero: tiene una línea demorada y el resto disponible, y
las tres opciones que se le ofrecen al Cliente operan sobre esa línea y no sobre el pedido. Sin
estado por línea, la opción «despachar lo disponible ahora» no se puede representar.

**`ArticuloRetenido` es donde aterriza esa opción.** El tomo que llega tarde queda retenido en el
local a nombre del Cliente con su propia fecha de vencimiento, y su ciclo es independiente del
pedido que lo originó.

**`TransaccionPago` guarda la referencia de la pasarela y no solo el monto.** Es lo que permite
reconocer un aviso repetido de la pasarela y no generar un segundo pedido por el mismo pago.

**`CasoDevolucion` es único por ítem de pedido**, en cualquier estado. La ficha lo pide
explícitamente para que un reclamo rechazado no pueda reabrirse como uno nuevo, y eso es una
restricción de identidad y no una comprobación de pantalla.
"""

[[area]]
id = "fidelizacion"
titulo = "Fidelización por puntos"
conceptos = []
planificados = ["LotePuntos", "MovimientoPuntos"]
invitados = ["accounts.Usuario"]
prosa = """
**Área enteramente planificada**, y la que más consecuencias tiene sobre el resto: cuatro casos de
uso de tres módulos distintos prometen reembolsar o compensar en puntos, y ninguno tiene todavía
dónde acreditarlos.

**El saldo no es un número en la cuenta del cliente: es la suma de sus lotes vigentes.** La ficha de
`CU-PTS-CAD` lo exige sin nombrarlo — la caducidad opera a nivel de lote individual y no sobre el
saldo total, así que un cliente puede tener simultáneamente lotes vencidos y lotes vigentes. Con un
saldo escalar no hay forma de saber qué parte caduca cuándo. Y el consumo es por orden de caducidad
más próxima, lo que exige poder distinguir un lote de otro.

**`MovimientoPuntos` es el registro de cada acreditación y cada débito con su saldo resultante**, que
es lo que `CU-PTS-CON` presenta como historial. No es derivable de los lotes: un débito consume
varios lotes parcialmente, y reconstruir el movimiento desde los saldos residuales de los lotes es
imposible una vez que hubo un segundo débito.

**`LotePuntos.origen` es el mismo enumerado en los cinco flujos que crean lotes** —compra, reembolso,
compensación y ajuste manual—, y esa unicidad de vocabulario es lo que permite responder de dónde
salió cada punto del sistema.
"""

[[area]]
id = "traza"
titulo = "Parámetros, contenido y trazabilidad"
conceptos = ["core.ConfiguracionSistema", "core.RegistroAuditoria"]
planificados = ["Banner", "ContenidoFAQ", "IdentidadVisual"]
invitados = ["accounts.Usuario"]
asociaciones_extra = [
  'class Concepto #EEEEEE',
  'RegistroAuditoria "0..*" ..> "0..1" Concepto : objetivo genérico',
  'note right of Concepto : No es una clase del dominio: representa a cualquier\nconcepto auditable. La referencia es por tipo y clave.',
]
prosa = """
**`RegistroAuditoria` apunta a cualquier cosa por un objetivo genérico** —el tipo de objeto y su
clave— y no por una clave foránea por cada tipo posible. Arrancó siendo una referencia a una cuenta,
porque el primer módulo que lo usó operaba sobre cuentas ajenas; con altas de lote, productos,
proveedores, correos y borradores auditados, una columna por objetivo posible habría dejado la tabla
con quince claves foráneas nulas.

**Es inmutable por diseño y no por permisos de pantalla.** El concepto rechaza su propia modificación
y su propio borrado, así que la garantía se sostiene aunque la operación se intente desde una consola
o desde el panel de administración de Django. La inmutabilidad que vive en la pantalla la esquiva
cualquier camino que no pase por ella, que es exactamente lo que un auditor no puede aceptar.

**Guarda el correo del actor y el del objetivo desnormalizados**, además de la referencia. Es lo que
hace que la traza sobreviva a la eliminación de la cuenta —la única eliminación física del sistema— y
lo que permite registrar un intento de acceso con un correo que no corresponde a ninguna cuenta.

**`ConfiguracionSistema` es una tabla de una sola fila** y el sistema fuerza su identificador en cada
guardado en vez de confiar en que nadie cree una segunda. Si hubiera dos, nadie sabría cuál rige y el
precio de los importados dependería de cuál se leyó primero.

**Los tres conceptos planificados del área son contenido de la tienda pública**, no parámetros.
`CU-CFG-VIS` está además con su alcance abierto: qué parte de la identidad visual es token fijo del
sistema de diseño y qué parte es configurable no está decidido, y de eso depende si `IdentidadVisual`
guarda tres colores o quince.
"""

