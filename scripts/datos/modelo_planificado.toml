#  Criterio de cada política de borrado
# ══════════════════════════════════════════════════════════════════

[[borrado]]
politica = "PROTECT"
criterio = "**Lo apuntado es un catálogo o un origen que no puede desaparecer sin dejar huérfano al que apunta.** Borrarlo tiene que fallar en voz alta, no llevarse datos por delante."

[[borrado]]
politica = "SET_NULL"
criterio = "**El vínculo es informativo y la fila sobrevive sin él.** Quién cargó un lote o de qué precio de referencia salió un precio son datos que enriquecen; perderlos no invalida la fila."

[[borrado]]
politica = "CASCADE"
criterio = "**Lo apuntado no tiene existencia propia fuera de su dueño.** Un nivel de confianza sin su borrador, o un precio de referencia sin su editorial, no significan nada."

# ══════════════════════════════════════════════════════════════════
#  Notas por tabla del Modelo de Datos
# ══════════════════════════════════════════════════════════════════

[nota_de_tabla]

"accounts.Usuario" = """
Extiende el usuario de Django, así que la tabla conserva sus columnas de infraestructura
—`password`, `is_staff`, `is_superuser`, `date_joined`— además de las del negocio. `is_active` no se
escribe a mano: lo deriva el concepto de `estado`, para que los dos no puedan discrepar.
"""

"core.ConfiguracionSistema" = """
Una sola fila, con identificador forzado a 1. La credencial del servicio de modelo de lenguaje se
guarda acá y nunca se devuelve al formulario: la pantalla muestra solo sus últimos caracteres.
"""

"core.RegistroAuditoria" = """
El objetivo es genérico: `objetivo_tipo` apunta al catálogo de tipos de contenido de Django y
`objetivo_pk` a la fila. Los dos correos desnormalizados existen para que la traza sobreviva a la
eliminación de la cuenta que nombra.
"""

"catalog.Producto" = """
La tabla del padre de la jerarquía. `clase` dice de qué hija es cada fila; la escribe el sistema.
`codigo` admite nulo en la columna porque se deriva de la clave primaria y se asigna en un segundo
guardado dentro de la misma transacción: el estado intermedio no existe para nadie de afuera.
"""

"catalog.ProductoEditorial" = """
`producto_ptr_id` es a la vez clave primaria y clave foránea al padre. `clave_edicion` es la columna
derivada que recupera como restricción de base la tupla descriptiva que la herencia había partido en
dos tablas.
"""

"catalog.LoteAlta" = """
`cre` lleva seis decimales porque es un cociente y no dinero. `cotizacion` se guarda incluso cuando
el lote es en pesos —vale 1— para que el cálculo de cualquier ítem se reconstruya sin preguntarse si
hubo conversión.
"""

"suppliers.CorreoProveedor" = """
`message_id` es la clave de idempotencia del ciclo de monitoreo. `remitente` guarda la dirección tal
como vino y no la del proveedor: si el proveedor cambia su correo, este archivo tiene que seguir
diciendo desde dónde llegó este mensaje.
"""

"catalog.BorradorProducto" = """
Casi todas sus columnas admiten nulo, y ésa es la diferencia de fondo con `catalog_producto`: un
borrador existe para poder guardar algo incompleto y que una persona lo termine. `reparos` guarda lo
que el sistema le corrigió al modelo; el nivel de confianza que el modelo declara sobre sí mismo va
en su propia tabla.
"""
