#  Invariantes
# ══════════════════════════════════════════════════════════════════

[[invariante]]
regla = "Todo producto tiene código, y el código no se repite ni cambia una vez asignado."
donde = "Restricción de base + validación del concepto"
tecnico = "columna `UNIQUE` sobre `codigo`; el valor lo deriva `Producto.save()` de la clave primaria"

[[invariante]]
regla = "Todo producto pertenece a uno de los dos rubros. No existe un producto «suelto»."
donde = "Validación del concepto"
tecnico = "`Producto.save()` levanta `ProductoAbstractoError` si la clase no declara rubro"

[[invariante]]
regla = "Dos productos editoriales no comparten ISBN, salvo que ninguno lo declare."
donde = "Restricción de base"
tecnico = "`producto_editorial_unico_por_isbn`, condicionada a ISBN no vacío"

[[invariante]]
regla = "Dos productos editoriales no comparten la tupla título + volumen + tipo + formato + editorial."
donde = "Restricción de base, sobre una columna derivada"
tecnico = "`producto_editorial_unico_por_clave` sobre `clave_edicion`, que `save()` recalcula"

[[invariante]]
regla = "El tipo de material de un producto pertenece al mismo rubro que el producto."
donde = "**Comprobación de formulario**"
tecnico = "`ProductoEditorial.clean()` y `ProductoNoEditorial.clean()`, que solo corren vía `full_clean()`. La confirmación de un borrador usa `objects.create()` y no pasa por ahí"

[[invariante]]
regla = "El material no editorial no admite pre-venta ni cancelación por editorial."
donde = "**Comprobación de formulario**"
tecnico = "`ProductoNoEditorial.clean()` contra `ESTADOS_PERMITIDOS`, por la misma razón que la fila anterior"

[[invariante]]
regla = "Un formato solo se ofrece para los tipos en los que aplica; sin tipos declarados es universal."
donde = "**Comprobación de formulario**"
tecnico = "`Formato.aplica_a()`, que usan el desplegable del alta y la validación del formulario. Ninguna escritura fuera de una pantalla lo consulta"

[[invariante]]
regla = "Un precio de referencia es único por la combinación editorial + tipo + formato."
donde = "Restricción de base"
tecnico = "`precio_unico_por_editorial_tipo_y_formato`"

[[invariante]]
regla = "Los nombres de los catálogos de clasificación no se repiten, sin distinguir mayúsculas."
donde = "Restricción de base sobre expresión"
tecnico = "cinco restricciones `Lower(nombre)`, materializadas como índices únicos"

[[invariante]]
regla = "Una etiqueta es única dentro de su grupo, no en todo el catálogo."
donde = "Restricción de base sobre expresión"
tecnico = "`etiqueta_unica_por_nombre_y_grupo`. «Terror» puede ser un género y una colección"

[[invariante]]
regla = "Ningún importe del sistema es negativo, y ningún precio de venta es cero."
donde = "**Comprobación de formulario**"
tecnico = "validadores `NO_NEGATIVO` y `POSITIVO`. Django los ejecuta en `full_clean()`, no en `save()`, así que la base admitiría un importe negativo escrito por fuera de una pantalla"

[[invariante]]
regla = "El correo de una cuenta identifica a una sola cuenta y se guarda en minúsculas."
donde = "Restricción de base + validación del concepto"
tecnico = "columna `UNIQUE`; `Usuario.save()` normaliza antes de guardar"

[[invariante]]
regla = "Solo una cuenta activa puede iniciar sesión."
donde = "Validación del concepto"
tecnico = "`Usuario.save()` deriva `is_active` del estado, de modo que no puedan desincronizarse"

[[invariante]]
regla = "Una cuenta solo se elimina físicamente si nunca inició sesión."
donde = "Validación del concepto"
tecnico = "`Usuario.se_puede_eliminar`, que exige estado pendiente y ningún inicio registrado"

[[invariante]]
regla = "Una entrada del log de auditoría no se modifica ni se borra, por ningún rol ni por ningún camino."
donde = "Validación del concepto"
tecnico = "`RegistroAuditoria.save()` y `.delete()` levantan `RegistroAuditoriaError`"

[[invariante]]
regla = "Existe exactamente una configuración del sistema."
donde = "Validación del concepto"
tecnico = "`ConfiguracionSistema.save()` fuerza la clave primaria; `delete()` está prohibido"

[[invariante]]
regla = "El correo comercial de un proveedor identifica a un solo proveedor, sin distinguir mayúsculas."
donde = "Restricción de base sobre expresión"
tecnico = "`proveedor_unico_por_correo_comercial`. Es el filtro de remitentes del pipeline"

[[invariante]]
regla = "Un mensaje de la casilla se encola una sola vez."
donde = "Restricción de base"
tecnico = "columna `UNIQUE` sobre `message_id`, que es la clave de idempotencia del ciclo"

[[invariante]]
regla = "Un borrador declara a lo sumo un nivel de confianza por campo."
donde = "Restricción de base"
tecnico = "`confianza_unica_por_campo_del_borrador`"

[[invariante]]
regla = "Un borrador con un campo de confianza baja sin revisar no se confirma."
donde = "En lote: validación del concepto. Individualmente: **comprobación de la vista**"
