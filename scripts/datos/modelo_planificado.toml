[[dominio.reglas]]
titulo = "1. La identidad la lleva un código; los datos descriptivos detectan duplicados."
texto = """
Son dos cosas distintas y confundirlas rompe el modelo. `Producto.codigo` **identifica**: existe
siempre, es único e inmutable. El ISBN, el código de barras y las tuplas descriptivas **detectan
duplicados**: pueden faltar sin que nada se rompa. Que no sean identidad no les quita la unicidad
—dos filas con el mismo ISBN son la misma edición cargada dos veces— pero sí les quita la obligación
de existir. En cuanto la marca o el título entran en la identidad, todo producto que no los tenga
—el merch genérico, lo no oficial— se vuelve inmodelable.
"""

[[dominio.reglas]]
titulo = "2. Los campos deciden, las etiquetas describen."
texto = """
Si algo entra en la clave de unicidad de un producto o en el cálculo de su precio, es un **campo**
con su propia entidad: `Tipo` (qué clase de cosa es) y `Formato` (el tamaño físico, que es lo que
fija el precio). Si solo sirve para **encontrar** productos, es una `Etiqueta`. Sin esa línea
escrita, las etiquetas se vuelven el tacho de basura del modelo y en seis meses "Ivrea" existe como
etiqueta *y* como editorial.
"""

[[dominio.reglas]]
titulo = "3. Lo que cambia el comportamiento del sistema es campo, aunque parezca etiqueta."
texto = """
`Producto.solo_adultos` excluye del catálogo público. Como etiqueta, la tienda tendría que comparar
contra la cadena `"NSFW"`, y renombrarla rompería el catálogo en silencio.
"""

[[dominio.reglas]]
titulo = "4. El modelo de lenguaje propone, nunca aplica."
texto = """
Nada de lo que una extracción produce entra al catálogo por su cuenta: produce un `BorradorProducto`
que una persona confirma. Por eso el borrador es una entidad propia y no un producto con una bandera
de "sin revisar" — un producto a medias en la misma tabla se filtra tarde o temprano en una consulta
que se olvide de excluirlo, y para cuando se nota ya estuvo a la venta. La misma regla explica la
`ConfianzaCampo`: el modelo declara cuánto confía en cada dato, y esa declaración es un dato del
sistema y no un comentario.
"""

[[dominio.reglas]]
titulo = "5. Un producto no es una entidad, son tres."
texto = """
`Producto` es lo general —lo que el inventario único consulta sobre los dos rubros— y
`ProductoEditorial` / `ProductoNoEditorial` agregan lo suyo. No son clases abstractas porque **no se
puede tener una referencia a un concepto abstracto**, y todo lo que viene (pedidos, ventas, ofertas,
carrito) tiene que poder apuntar a *un producto*. La consecuencia física está en el apartado de
herencia del Modelo de Datos: un tomo editorial son dos filas en dos tablas.
"""

