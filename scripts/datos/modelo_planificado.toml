concepto = "Producto"
estado = "construido"
modelo = "catalog.Producto"
campo = "estado"
nota = """
**«Cancelado por editorial» es terminal y del que no se retorna.** Un título cancelado no llega
nunca, y por eso se reembolsa el 100 %. La baja de catálogo rechaza expresamente un producto en ese
estado en lugar de descatalogarlo, y la reactivación tampoco lo admite: moverlo a un estado del que
sí se retorna borraría la única marca de que ese título no va a llegar nunca.

**«Descatalogado» sí vuelve.** Es la baja lógica del catálogo, y conserva el producto en el
inventario interno y en el historial.

**El material no editorial no admite «Pre-venta» ni «Cancelado por editorial»**, y eso se valida en
el concepto y no escondiendo la opción en la pantalla.

**«Demorado» no aparece acá porque no es un estado**, es un indicador que acompaña a «Pre-venta».
