Dos estados y un ciclo que no vuelve, pero el cierre no es una formalidad: **es lo que dispara los
correos de pedido consolidado**, uno por proveedor involucrado en las confirmaciones de esa sesión.
Por eso el cierre es una acción deliberada y no el efecto de abandonar la pantalla.

La sesión es **por revisor**: dos administradores revisando simultáneamente constituyen dos tandas y
producen dos correos separados al mismo proveedor, que es lo correcto.
