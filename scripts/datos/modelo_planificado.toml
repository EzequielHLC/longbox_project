[[ciclo]]
id = "DME-01"
concepto = "Cuenta de usuario"
estado = "construido"
modelo = "accounts.Usuario"
campo = "estado"
nota = """
**La cuenta dada de baja se congela, no se edita.** Si se pudiera, quedarían cambios preparados sobre
una cuenta dormida —otro correo, un rol más alto— que recién surtirían efecto cuando alguien la
reactivara. Congelarla obliga a que todo camino de vuelta al acceso pase por una reactivación
explícita y auditada.

**Reactivar devuelve a «pendiente de activación» y no a «activo».** Quien vuelve tiene que elegir
contraseña de nuevo, porque no hay forma de saber quién tuvo acceso al correo mientras la cuenta
estuvo de baja.

**La eliminación física es el único borrado del sistema y solo alcanza a lo que nunca se usó.** No
alcanza con estar pendiente: una cuenta reactivada también lo está, y ésa sí tiene historial. La
prueba de que nunca se usó es no tener ningún inicio de sesión registrado.
"""

[[ciclo.transiciones]]
de = "*"
a = "Pendiente de activación"
evento = "alta de personal"

[[ciclo.transiciones]]
de = "*"
a = "Activo"
evento = "registro de cliente"

[[ciclo.transiciones]]
de = "Pendiente de activación"
a = "Activo"
evento = "activación con el enlace"

[[ciclo.transiciones]]
de = "Pendiente de activación"
a = "*"
evento = "eliminación (nunca inició sesión)"

[[ciclo.transiciones]]
de = "Activo"
a = "Inactivo"
evento = "baja"

[[ciclo.transiciones]]
de = "Inactivo"
a = "Pendiente de activación"
evento = "reactivación"

[[ciclo]]
id = "DME-02"
concepto = "Proveedor editorial"
estado = "construido"
modelo = "suppliers.Proveedor"
campo = "estado"
nota = """
El ciclo es simple, pero la baja **no es cosmética**: saca al proveedor del filtro de remitentes del
pipeline, de modo que sus correos dejan de encolarse. Hay además una segunda bandera independiente
del estado —el procesamiento de novedades— porque la relación comercial puede estar viva y el
parseo de sus correos apagado: un proveedor que manda las novedades en un formato que el modelo lee
mal se registra igual, pero no conviene que alimente el pipeline.
"""

[[ciclo.transiciones]]
