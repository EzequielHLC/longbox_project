estado = "planificado"
origen = "`CU-PTS-CJE`, `CU-PTS-CAD` y `CU-PTS-ADM`"
nota = """
**«Agotado» y «Vencido» no son lo mismo y hay que distinguirlos.** Un lote agotado se consumió: sus
puntos se gastaron y el cliente recibió algo a cambio. Un lote vencido caducó sin usarse. Fundirlos
en un solo estado terminal haría imposible responder cuántos puntos perdió un cliente por no usarlos,
que es exactamente el dato que la notificación de caducidad le informa.

**El consumo es por caducidad más próxima**, no por antigüedad de acreditación. Es una diferencia real
cuando un ajuste manual crea un lote con caducidad distinta de la estándar.

**Un lote con puntos comprometidos en un canje sin confirmar no se vence:** el ciclo de caducidad
difiere la invalidación hasta que la transacción concurrente se resuelva.
"""

