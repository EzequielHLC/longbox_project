[[ciclo]]
id = "DME-03"
concepto = "Correo de proveedor"
estado = "construido"
modelo = "suppliers.CorreoProveedor"
campo = "estado"
nota = """
**Éste es el ciclo donde vive la regla de que nada costoso se ejecuta sin aprobación explícita.** El
correo entra en «Pendiente» y se queda ahí: la transición a «En proceso» la dispara una persona, no
el reloj.

**«Fallido» no vuelve a «Descartado» y no es lo mismo.** Un fallo puede deberse a una indisponibilidad
transitoria del servicio de modelo de lenguaje y no al contenido del mensaje; descartarlo perdería un
anuncio de novedades legítimo. Por eso el correo fallido permanece en la cola y se puede reprocesar.

**El descarte exige motivo.** Una cola llena de descartes sin explicación no permite después decidir
a qué proveedores conviene dejarles el procesamiento habilitado.
"""

