# Lo que el Modelo de Dominio y el Modelo de Datos necesitan y el código no sabe.
#
# `generar_modelos.py` deriva del código todo lo que el sistema ya construyó.
# Este archivo aporta las tres cosas que no están ahí:
#
#   1. Los conceptos **planificados**, derivados de las fichas de los casos de
#      uso que todavía no se construyeron. Cada uno declara de qué ficha sale.
#   2. Las **transiciones** de los ciclos de vida. El código declara los estados
#      —son el enumerado de un campo— pero no desde qué estado es legal llegar a
#      cuál: eso vive repartido en servicios y vistas, y se declara acá.
#   3. La **prosa** que ordena el modelo, el duplicado concreto que previene
#      cada restricción de unicidad y la consulta que atiende cada índice.
#
# Regenerar reescribe los dos .md y no toca este archivo.

# ══════════════════════════════════════════════════════════════════
#  Modelo de Dominio — prosa
# ══════════════════════════════════════════════════════════════════

[dominio]

intro = """
Este documento describe **qué conceptos existen en el negocio, qué sabe cada uno y cómo se
relacionan**. No describe cómo se guardan: para eso está [`MODELO_DE_DATOS.md`](MODELO_DE_DATOS.md),
que es el mismo sistema visto desde la base.

**Cubre el sistema completo: lo construido y lo planificado.** Un modelo de dominio que solo
describa lo implementado no sirve para diseñar lo que falta, y uno que no distinga entre ambos hace
creer que existe algo que no existe. La distinción es visual y está declarada en cada diagrama.
"""

notacion = """
Los conceptos se dibujan con dos notaciones y la diferencia no es decorativa: separa lo que se puede
verificar contra el código de lo que solo se puede verificar contra una ficha.

| Notación | Significado | De dónde se derivó |
| --- | --- | --- |
| Caja de línea llena, fondo azul | **Construido.** El concepto existe hoy | De `apps/*/models.py` y de las migraciones. Sus atributos, sus asociaciones y sus estados se leen del código en cada regeneración |
| Caja de línea de trazos, fondo ámbar | **Planificado.** El concepto todavía no existe | De la ficha del caso de uso que lo presupone. Cada caja planificada declara en una nota de qué ficha sale |

Un concepto planificado **no es una promesa de implementación**: es un concepto que alguna ficha ya
da por existente. Que aparezca acá significa que el día que ese caso de uso se construya, va a
necesitarlo; no significa que su forma esté decidida.

Los atributos llevan estereotipos entre comillas angulares: `«único»` cuando la base lo garantiza,
`«opcional»` cuando admite ausencia, `«derivado»` cuando lo escribe el sistema y no quien crea el
objeto.
"""

vista_general = """
Siete áreas. Una está construida por completo, cuatro están a medias y dos son enteramente
planificadas. El detalle de cada una viene después; esta vista sirve para ubicar dónde cae cada
concepto y para ver de un vistazo cuánto del dominio existe hoy: **diecinueve conceptos existen y
diecisiete todavía no.**

Las flechas de trazos son las que cruzan de lo construido a lo planificado. Son el mapa de dónde va
a tocar el código cuando esos módulos se construyan.
"""

ciclos_intro = """
Los ciclos de vida son diagramas de máquina de estados numerados `DME-NN`. Se incluyen únicamente
los conceptos cuyo estado gobierna qué se les puede hacer: un concepto con dos estados que solo
sirven para filtrar no tiene ciclo de vida, tiene una bandera.

**De dónde sale cada mitad del diagrama.** En los ciclos construidos, los *estados* se leen del
enumerado del campo correspondiente, así que agregar un estado en el código lo agrega al diagrama.
Las *transiciones* no están declaradas en ninguna parte del código —un `save()` que cambia un valor
no dice desde qué otro valor era legal venir— y por eso se mantienen en el archivo de datos del
generador. En los ciclos planificados, las dos mitades salen de la ficha.

**La numeración `DME-NN` de este documento arranca en 01 y reemplaza a la anterior.** Los contratos
del documento de análisis citan `DME-01` (ProductoEditorial), `DME-02` (Pedido) y `DME-04`
(LotePuntos) con otra asignación; esa correspondencia está en el mapeo de
`docs/diagramas/README-diagramas.md`.
"""

invariantes_intro = """
Cada invariante dice **dónde se sostiene**, y esa columna es el punto de la tabla. Un invariante que
solo vive en el formulario no es un invariante: lo esquiva la primera operación que no pase por esa
pantalla —un comando de gestión, el pipeline automatizado, una consola.

Los tres lugares posibles, de más fuerte a más débil:

- **Restricción de base.** La garantiza el motor. Sobrevive a cualquier camino de escritura.
- **Validación del concepto.** Vive en el modelo (`clean()`, `save()`, una propiedad). Cubre todo lo
  que pase por el ORM, que es todo el sistema, pero no una escritura en SQL directo.
- **Comprobación de formulario o de vista.** Cubre una pantalla. Es legítima solo cuando lo que
  valida es la entrada y no el estado —que dos campos del formulario sean coherentes entre sí, por
  ejemplo.

**Una advertencia que hay que leer antes de la tabla.** En Django, los validadores de campo y el
`clean()` del modelo **no corren al guardar**: los ejecuta `full_clean()`, y `full_clean()` lo
llaman los formularios de modelo, no `save()` ni `objects.create()`. Este proyecto no invoca
`full_clean()` en ninguna parte de su código de aplicación, de modo que todo invariante cuya única
sede es un validador o un `clean()` **se sostiene únicamente en el camino del formulario**. El
pipeline automatizado, los comandos de gestión y la consola lo esquivan.

Esa es la razón de que varias filas de abajo digan «comprobación de formulario» donde a primera
vista parecerían validación del concepto. Está declarado y no disimulado: son los invariantes cuya
promoción a restricción de base o a `save()` queda como deuda registrada.
"""

ausencias = """
Lo que sigue no es una lista de pendientes: es la explicación de varias decisiones del modelo
actual. Un concepto que no existe deja huellas en los que sí existen, y sin nombrarlas esas huellas
parecen arbitrariedades.

- **No hay Pedido, y por eso `Producto.stock` es un número y no un saldo.** Hoy el stock se escribe
  en el alta y se lee en el inventario; nada lo reserva ni lo compromete. Cuando exista Pedido, la
  pregunta "¿cuántas unidades hay disponibles?" va a dejar de tener una sola respuesta.
- **No hay LotePuntos, y por eso ningún concepto tiene saldo.** El reembolso íntegro en puntos que
  cuatro casos de uso prometen no tiene todavía dónde acreditarse.
- **No hay Oferta, y por eso `Producto.precio` es el precio que se cobra.** Cuando exista, el precio
  del producto va a dejar de ser el precio efectivo y va a pasar a ser el precio base sobre el que
  se aplica un descuento vigente.
- **No hay Carrito, y por eso ninguna propagación de precios tiene a quién avisarle.** Es lo que
  deja parciales a `CU-PVP-TAB` y `CU-PVP-MAR`: la propagación existe como cálculo y no tiene
  destinatarios.
- **No hay ArticuloRetenido, y por eso la opción 2 de un artículo demorado no tiene dónde dejar el
  tomo cuando llegue.**
- **No hay entidad de reserva separada.** Una pre-venta va a ser una `LineaDePedido` con su propio
  estado, no un concepto aparte: lo que se reserva es una línea de un pedido pagado, no un objeto
  independiente que después haya que reconciliar con un pedido.
- **`RegistroAuditoria` ya está poblado y nadie lo consulta.** La escritura opera desde todos los
  módulos construidos; la consulta con filtros es `CU-AUD-CON` y no está hecha. Es el único concepto
  del sistema cuya mitad de escritura precede en varios meses a la de lectura, y es deliberado: un
  log que empieza a escribirse tarde tiene un agujero que ya no se puede llenar.
"""

cruces = [
