[esquema]

intro = """
El esquema físico de lo que está construido, leído de `apps/*/models.py` y de las 46 migraciones del
repositorio. **Cubre únicamente lo construido:** los conceptos planificados no tienen tabla, y
listarlos acá haría creer que la tienen. Están en
[`MODELO_DE_DOMINIO.md`](MODELO_DE_DOMINIO.md), con su notación propia.

El motor es PostgreSQL 16 y los tipos de la columna «Tipo del motor» son los que Django emite para
ese backend.
"""

convenciones = """
- **Nombres de tabla.** Django los forma como `app_modelo` en minúsculas y sin separador entre
  palabras: `catalog_productoeditorial`, `suppliers_correoproveedor`.
- **Clave primaria.** Todas las tablas llevan `id` autoincremental de 64 bits (`bigint`). Ninguna
  usa clave natural, y es deliberado: un ISBN puede faltar y una razón social puede corregirse.
- **Claves foráneas.** La columna se llama como el campo más el sufijo `_id`.
- **Nulo vs. cadena vacía.** El proyecto sigue la convención de Django: los campos de texto ausentes
  se guardan como cadena vacía y no como `NULL`, de modo que un texto tiene un solo valor para "no
  hay dato". Los demás tipos sí usan `NULL`. Eso explica por qué varias restricciones de unicidad
  llevan la condición «solo cuando el campo no está vacío»: sin ella, todas las filas sin ISBN
  chocarían entre sí por compartir la cadena vacía.
- **Fechas.** Todas las marcas de tiempo se guardan con zona horaria (`timestamp with time zone`).
- **Dinero.** Siempre `numeric`, nunca punto flotante. Los precios llevan dos decimales; el
  coeficiente de importación lleva seis, porque es un cociente y no dinero, y recortarlo antes de
  aplicarlo arrastraría el error a cada precio del lote.
"""

er_intro = """
El diagrama muestra **solo las claves**: la primaria de cada tabla y las foráneas que la vinculan.
Con diecinueve tablas, dibujar todas las columnas produce una figura que no se puede leer, y el
detalle completo viene después, tabla por tabla.

Dos tablas de Django aparecen como destino de una clave foránea y no como entidad propia:
`django_content_type`, a la que apunta el objetivo genérico del registro de auditoría, y
`auth_group` / `auth_permission`, del sistema de permisos que el proyecto no usa para autorizar
—la autorización va por el rol de la cuenta— pero que el usuario de Django arrastra.
"""

unicidad_intro = """
Dispersas por tabla, las restricciones de unicidad se leen como detalles de implementación. Juntas
son otra cosa: **son el conjunto de reglas de identidad del sistema**, la respuesta completa a la
pregunta de cuándo dos filas son la misma cosa cargada dos veces.

Dos observaciones que valen para toda la tabla:

- **Las que se definen sobre una expresión se materializan como índice único y no como restricción
  de tabla.** Todas las de nombre sin distinguir mayúsculas están en ese caso. Buscarlas en
  `information_schema.table_constraints` da un falso negativo: hay que mirarlas en `pg_indexes`.
- **Una clave de identidad falta y no es un olvido.** La tupla descriptiva de un producto editorial
  —título, volumen, tipo, formato y editorial— no puede ser una restricción de base con herencia
  multi-tabla, porque título y tipo viven en la tabla del padre y el resto en la de la hija, y una
  restricción no abarca dos tablas. Lo que la recupera es `clave_edicion`, una columna derivada que
  copia los cinco valores a la tabla de la hija para que la restricción vuelva a caber.
"""

borrado_intro = """
Cada relación declara qué pasa con la fila que apunta cuando desaparece la fila apuntada. Las tres
políticas del sistema responden a tres criterios distintos, y agrupadas así se ve que no hay
excepciones sueltas.
"""

herencia = """
Es lo que más sorprende al leer el esquema por primera vez, y conviene explicarlo antes de que
parezca un error: **un tomo editorial son dos filas en dos tablas.**

`Producto` guarda lo común a los dos rubros —código, título, tipo, estado, stock, precio— y cada
especialización agrega una tabla con lo suyo. La fila hija no repite las columnas del padre: las
alcanza por una columna que es al mismo tiempo su clave primaria y una clave foránea al padre.
Consultar un producto editorial completo es entonces una unión de las dos tablas, y Django la hace
sola.

**Por qué así y no con una tabla de columnas nulables.** Un mazo de cartas no tiene editorial, ni
volumen, ni ISBN, ni formato; un tomo no tiene marca. Con una sola tabla, la mitad de las columnas de
cada fila serían nulas y lo que las hace obligatorias o no viviría en validaciones sueltas, lejos del
esquema. Acá la base misma dice qué campos existen para qué cosa.

**Por qué no clases abstractas.** El inventario de `CU-CAT-INV` es único: un listado con los mismos
filtros sobre los dos rubros a la vez, ordenado y paginado. Con tablas independientes esa consulta
no existe, y tampoco existirían las claves foráneas que ya apuntan al padre —`BorradorProducto`, la
auditoría, y las que traigan pedidos y ventas.

**Las tres consecuencias que hay que tener presentes al leer el esquema:**

1. `catalog_producto` tiene una columna `clase` que dice de qué hija es cada fila. Django sabe llegar
   a la hija sin ella, pero la columna permite contar y filtrar por rubro sin salir de la tabla del
   padre, y permite condicionar una restricción de unicidad a un solo rubro.
2. Recorrer un listado del padre y bajar a la hija por fila es el N+1 clásico de esta forma de
   herencia. Se resuelve trayendo las hijas en la misma consulta.
3. Guardar un producto editorial **por la tabla del padre no recalcula `clave_edicion`**, porque el
   `save()` del padre no toca la tabla de la hija. Un producto editorial se edita siempre por su
   propia clase.

Los enlaces concretos del esquema:
"""

migraciones_intro = """
El orden en que la base llegó a su forma actual. La columna de la derecha sale del docstring de cada
migración cuando lo tiene, y del nombre del archivo cuando no.

**Lo que esta tabla no puede decir es si están aplicadas.** La suite de pruebas crea una base
temporal desde cero, así que puede quedar en verde con migraciones sin aplicar sobre la base de
desarrollo y las pantallas caídas. Eso se verifica a mano, con el listado de migraciones pendientes,
antes de cerrar cada módulo.
"""

ausencias = """
- **Nada de comercio.** No hay tabla de pedido, línea de pedido, carrito, transacción de pago ni
  cierre de caja. Es la mitad del sistema y es el bloque que más claves foráneas va a agregar sobre
  `catalog_producto` y `accounts_usuario`.
- **Nada de fidelización.** No hay lote de puntos ni movimiento de puntos, y por lo tanto ningún
  cliente tiene saldo.
- **Nada de ofertas.** `catalog_producto.precio` es hoy el precio efectivo porque no hay descuento
  que aplicarle.
- **Nada de restock.** No hay propuesta ni línea de propuesta ni suscripción de reposición, aunque
  `CU-RST-PED` —el envío del correo consolidado— sí está construido: opera sobre un conjunto de
  productos que le entrega su invocante, sin tabla propia.
- **Nada de stock almacenado en local.**
- **Nada de contenido de tienda:** banners, FAQ e identidad visual.
- **`ConfiguracionSistema` administra tres de los quince parámetros que `CU-CFG-PAR` enumera.** Los
  doce restantes pertenecen a módulos no construidos y no tienen columna todavía.
"""

