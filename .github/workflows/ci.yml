# Las cuatro puertas de calidad del proyecto, en el orden en que conviene que
# fallen: primero lo que tarda segundos (formato, lint, seguridad), después la
# suite entera.
#
# **Lo que se corre acá tiene que ser lo mismo que corre `pre-commit`.** Las
# versiones salen de `requirements-dev.txt` y los `rev` de
# `.pre-commit-config.yaml` están fijados a esas mismas: con dos versiones de la
# misma herramienta, el commit pasa en la máquina y falla acá, o peor, al revés.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # La misma línea mayor que la base de desarrollo. Con versiones
        # distintas, una restricción o una función que anda en una no anda en
        # la otra y el CI deja de ser una prueba de lo que se despliega.
        image: postgres:18
        env:
          POSTGRES_DB: longbox_test
          POSTGRES_USER: longbox_user
          POSTGRES_PASSWORD: longbox_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: longbox_test
      DB_USER: longbox_user
      DB_PASSWORD: longbox_pass
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (Ruff + Black check)
        run: |
          ruff check .
          black --check .

      - name: Security (Bandit)
        # Los tests quedan afuera porque bandit marca cada `assert` como B101, y
        # en una suite de pytest el assert es la herramienta correcta.
        run: bandit -q -r apps config -x "*/tests/*,*/migrations/*"

      - name: Migraciones al día
        # Atrapa el modelo cambiado sin su migración. Ojo con lo que **no**
        # atrapa: que la migración esté aplicada sobre una base real. Eso solo
        # lo dice `showmigrations` contra la base de destino.
        run: python manage.py makemigrations --check --dry-run

      - name: Chequeo de despliegue
        # La lista de `check --deploy` es deuda de despliegue, no opinión.
        # Descubrirla el día de la demostración es tarde.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: ejemplo.test
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests with coverage
        run: pytest --cov=apps --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
