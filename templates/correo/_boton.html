{% load correo %}{# El botón primario: la acción del correo. Recibe `url` y `texto`. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="{% estilo 'acciones' %}">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td bgcolor="{% color 'senal' %}" style="{% estilo 'boton-celda' %}"><a href="{{ url }}" style="{% estilo 'boton' %}">{{ texto }}</a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<p style="{% estilo 'secundario' %}">Si el botón no funciona, copie este enlace en el navegador:</p>
<p style="{% estilo 'enlace-caja' %}"><a href="{{ url }}" style="{% estilo 'enlace' %}">{{ url }}</a></p>
