{% comment %}
El filtro de la propuesta (plan 00 de interfaz, segunda parte, 14.4): esconde
las filas que no coinciden y abre los proveedores que tienen alguna. Sin guion,
el campo no hace nada y la propuesta se ve entera.
{% endcomment %}
<script>
  (function () {
    const campo = document.querySelector("[data-filtro-restock]");
    if (!campo) return;
    campo.addEventListener("input", function () {
      const texto = campo.value.trim().toLowerCase();
      for (const grupo of document.querySelectorAll(".grupo-plegable")) {
        let alguna = false;
        for (const fila of grupo.querySelectorAll("[data-fila-restock]")) {
          const coincide = !texto || fila.dataset.filaRestock.includes(texto);
          fila.hidden = !coincide;
          alguna = alguna || coincide;
        }
        grupo.hidden = !alguna;
        if (texto && alguna) grupo.open = true;
      }
    });
  })();
</script>
