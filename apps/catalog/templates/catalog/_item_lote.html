{% comment %}
Un ítem del lote. Se dibuja dos veces: una por cada formulario del formset, y
otra dentro de un `<template>` como molde de los que se agregan desde el
navegador. Recibe `form` e `indice`, y lee `es_importado` del contexto.

Los `data-` son el contrato con el script de la pantalla:

  data-item        delimita el bloque.
  data-numero      el rótulo que se renumera al quitar un ítem del medio.
  data-campo="…"   envuelve un campo que aparece o desaparece según el tipo.
  data-desglose    el bloque de valores calculados, sólo en importados.
  data-herencia    la fila que avisa que la clasificación viene de la cabecera.

Qué campos se ven no está escrito acá ni en el JavaScript: sale del tipo
elegido, que es lo mismo que lee el servidor. La bandera decide **qué se
muestra**, no qué es obligatorio.
{% endcomment %}
<article data-item class="item-lote{% if form.errors %} item-lote--con-error{% endif %}">

  <div class="item-lote__cabecera">
    <div class="fila fila-base">
      <span data-numero class="item-lote__numero">{{ indice }}</span>
      <span class="texto-chico secundario">Ítem</span>
      {% if form.errors %}
        <span class="marca-estado marca-estado--atencion">{{ form.errors|length }} error{{ form.errors|length|pluralize:"es" }}</span>
      {% endif %}
    </div>

    <div class="fila-5">
      <button type="button" data-duplicar class="boton-texto texto-chico"
              title="Crear otro ítem con los mismos datos y el volumen siguiente">
        {% include "_iconos.html" with icono="agregar" %}<span>Duplicar</span>
      </button>
      <button type="button" data-quitar class="boton-texto texto-chico">
        {% include "_iconos.html" with icono="cerrar" %}<span>Quitar</span>
      </button>
    </div>
  </div>

  {% if form.non_field_errors %}
    <ul class="mensajes">
      {% for error in form.non_field_errors %}
        <li class="mensaje mensaje--error" role="alert">{% include "_iconos.html" with icono="error" %}<span><span class="mensaje__prefijo">Error:</span> {{ error }}</span></li>
      {% endfor %}
    </ul>
  {% endif %}

  {# Identificación: los dos únicos campos obligatorios en todos los casos. #}
  <div class="rejilla-4">
    <div class="abarca-3">{% include "_campo.html" with campo=form.titulo %}</div>
    {% include "_campo.html" with campo=form.volumen %}
  </div>

  {% comment %}
  El ISBN va junto a la identificación y no entre los datos opcionales, aunque
  lo sea: es el criterio más confiable para detectar que este tomo ya está
  cargado.
  {% endcomment %}
  <div class="rejilla-2">
    {% include "_campo.html" with campo=form.isbn %}
  </div>

  {% comment %}
  Clasificación. Mientras la cabecera declare editorial y tipo, estos campos
  llegan bloqueados con el valor heredado. El botón de al lado es la salida para
  el caso raro. La clasificación heredada la puso el sistema: va marcada.
  {% endcomment %}
  <div data-herencia class="superficie fila fila-entre hidden">
    <p class="texto-chico">
      Clasificación heredada de la cabecera:
      <span data-herencia-detalle class="calculado" title="calculado"></span>
    </p>
    <button type="button" data-desbloquear class="boton-texto texto-chico">
      {% include "_iconos.html" with icono="editar" %}<span>Usar otra</span>
    </button>
  </div>

  <div class="rejilla-3">
    <div data-campo="editorial" class="pila-2">
      {% include "_campo.html" with campo=form.editorial %}
      {% comment %}
      Alta de editorial sin salir de la pantalla: el caso real es llegar con un
      tomo de una editorial que todavía no está cargada.
      {% endcomment %}
      <button type="button" data-catalogo-rapido="editorial"
              data-url="{% url 'catalog:editorial_rapida' %}" data-etiqueta="la editorial"
              class="boton-texto texto-chico">
        {% include "_iconos.html" with icono="agregar" %}<span>Agregar editorial</span>
      </button>
    </div>
    {% include "_campo.html" with campo=form.tipo %}
    <div data-campo="formato" class="min-0">
      {% include "_campo.html" with campo=form.formato %}
    </div>
  </div>

  {{ form.desbloqueado }}

  {% if es_importado %}
    <div class="rejilla-2">
      {% include "_campo.html" with campo=form.costo_origen %}
      {% include "_campo.html" with campo=form.precio %}
    </div>

    <dl data-desglose class="superficie rejilla-3">
      <div class="pila-1">
        <dt class="etiqueta">Costo en pesos</dt>
        <dd data-costo class="datos">$0,00</dd>
      </div>
      <div class="pila-1">
        <dt class="etiqueta">Precio base</dt>
        <dd data-base class="datos">$0,00</dd>
      </div>
      <div class="pila-1">
        <dt class="etiqueta">Precio final</dt>
        <dd data-final class="cifra-derivada calculado fuerte" title="calculado">$0,00</dd>
      </div>
    </dl>

    {% comment %}
    Advertencia de romper el vínculo con el margen global: avisa de una
    consecuencia que hay que aceptar antes de seguir. La casilla es la
    confirmación, y se vuelve a exigir en el servidor.
    {% endcomment %}
    <div data-aviso-precio class="panel panel--atencion hidden">
      <p>
        Precio a mano: deja de recalcularse con el margen.
      </p>
      {% include "_casilla.html" with campo=form.confirma_precio_manual critico=1 %}
    </div>
  {% else %}
    <div class="rejilla-2">
      <div class="pila-1">
        {% include "_campo.html" with campo=form.precio %}
        <p data-referencia class="ayuda"></p>
      </div>
    </div>
    {% comment %}
    CU-ALT-NAC A3: un precio distinto del de la tabla rompe el vínculo con la
    combinación. La casilla es la confirmación, y se vuelve a exigir en el servidor.
    {% endcomment %}
    <div data-aviso-precio class="panel panel--atencion{% if not form.confirma_precio_manual.value and not form.precio.errors %} hidden{% endif %}">
      <p>Precio a mano: deja de actualizarse con la tabla de precios de referencia.</p>
      {% include "_casilla.html" with campo=form.confirma_precio_manual critico=1 %}
    </div>
  {% endif %}

  <div class="rejilla-3">
    {% include "_campo.html" with campo=form.estado %}
    {% include "_campo.html" with campo=form.fecha_llegada %}
    {% include "_campo.html" with campo=form.stock %}
  </div>

  {# Datos informativos: ninguno bloquea el alta. #}
  <details class="divisor">
    <summary class="fuerte">Datos opcionales</summary>
    <div class="pila separado-arriba">
      <div class="rejilla-2">
        {% include "_campo.html" with campo=form.autor %}
        {% include "_campo.html" with campo=form.portada ayuda="Sin portada, el producto queda marcado como “Imagen pendiente”." %}
      </div>
      {% include "_campo.html" with campo=form.sinopsis %}

      {% comment %}
      Etiquetas **propias** del ítem. Las del lote se declaran una sola vez en la
      cabecera y las heredan todos; esto es para lo que distingue a este tomo.
      {% endcomment %}
      {% include "_etiquetas.html" with campo=form.etiquetas %}

      {% include "_casilla.html" with campo=form.solo_adultos %}
    </div>
  </details>
</article>
