{% extends "base.html" %}

{% block titulo %}Contraseña actualizada · Longbox{% endblock %}

{% block contenido %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="mb-4 text-2xl font-semibold">La contraseña se actualizó</h1>
  <p class="text-sm text-slate-700">
    Por seguridad se cerraron todas las sesiones abiertas de la cuenta. Inicie sesión
    nuevamente con la contraseña establecida.
  </p>
  <a href="{% url 'accounts:login' %}"
     class="mt-6 inline-block rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">
    Ir al login
  </a>
</div>
{% endblock %}
