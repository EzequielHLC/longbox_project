# Ajuste del servicio de Caddy para usar `config/caddy/Caddyfile` del repositorio.
# Va en /etc/systemd/system/caddy.service.d/longbox.conf.
#
# El Caddyfile usa rutas relativas (`staticfiles`, `media`), así que arranca desde
# la raíz del sistema, y toma el nombre público del entorno.
[Service]
WorkingDirectory=/srv/longbox
Environment=LONGBOX_HOST=longbox.chilecentral.cloudapp.azure.com
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /srv/longbox/config/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /srv/longbox/config/caddy/Caddyfile --force
