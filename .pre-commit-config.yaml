# **Las versiones de acá tienen que coincidir con `requirements-dev.txt`.** No es
# prolijidad: pre-commit instala cada hook en su propio entorno, así que con
# `rev` desfasado se corren dos versiones distintas de la misma herramienta y
# empiezan a discrepar. Ya pasó — bandit 1.7.9 daba por bueno lo que 1.9.4
# marcaba, y el commit entraba con un hallazgo que el CI iba a levantar después.
#
# pre-commit le pasa a cada hook la lista de archivos del commit. Ojo con dos
# consecuencias de eso:
#   - No hay que fijar un target en `args` (por ejemplo `-r apps`): el posicional
#     quedaría partido en dos por el resto de los flags y argparse falla.
#   - Las exclusiones de `pyproject.toml` no alcanzan, porque solo se aplican
#     cuando la herramienta recorre directorios por su cuenta. Para los archivos
#     pasados a mano hay que excluirlos acá, con `exclude`.
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        exclude: /migrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: /migrations/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-q"]
        # Tests afuera: bandit marca cada `assert` como B101 y en una suite de
        # pytest el assert es justamente la herramienta correcta.
        exclude: (/tests/|/tests\.py$|/migrations/)
